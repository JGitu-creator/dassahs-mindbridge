<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --prism-blue: #3b82f6;
      --prism-purple: #8b5cf6;
      --prism-dark: #0f172a;
    }
    body {
      width: 320px;
      padding: 0;
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--prism-dark);
      color: white;
      overflow: hidden;
    }
    .container {
      padding: 32px 24px;
      background: radial-gradient(circle at top right, rgba(59,130,246,0.15), transparent);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }
    .logo-circle {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--prism-blue), var(--prism-purple));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-style: italic;
      font-size: 24px;
      box-shadow: 0 10px 30px rgba(59,130,246,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .text-area {
      space-y: 4px;
    }
    h1 {
      font-size: 24px;
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.03em;
      font-style: italic;
      background: linear-gradient(to bottom, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 10px;
      color: var(--prism-blue);
      margin: 4px 0 0 0;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.3em;
    }
    #status {
      font-size: 9px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 800;
      padding: 10px 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    button {
      width: 100%;
      background: linear-gradient(to right, #2563eb, #4f46e5);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 18px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4);
      filter: brightness(1.1);
    }
    button:active {
      transform: translateY(0) scale(0.98);
    }
    .footer {
      padding: 16px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(0,0,0,0.2);
    }
    .footer-text {
      font-size: 8px;
      color: #475569;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-circle">DP</div>
    <div class="text-area">
      <h1>DASSAH&apos;S PRISM</h1>
      <p class="subtitle">THE NEURAL BRIDGE</p>
    </div>
    
    <div id="status">NEURAL LINK: STANDBY</div>
    
    <button id="simplifyBtn">
      REFRACT NOISE
    </button>
  </div>
  <div class="footer">
    <div class="footer-text">DJ | SOVEREIGN ARCHITECT</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
