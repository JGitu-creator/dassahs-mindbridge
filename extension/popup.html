<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .icon {
      width: 32px;
      height: 32px;
      background: #3b82f6;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .title {
      font-weight: 800;
      font-size: 18px;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgb(37 99 235 / 0.2);
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .status {
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">B</div>
    <div class="title">Cognitive Filter</div>
  </div>

  <button id="simplifyBtn" class="btn">Simplify This Page</button>
  <div id="status" class="status">Click to remove the noise!</div>

  <div class="footer">
    Requires your Cognitive Filter App to be running at localhost:3000
  </div>

  <script src="popup.js"></script>
</body>
</html>
