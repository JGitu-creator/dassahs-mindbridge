<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }
    .logo-area {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      font-style: italic;
      letter-spacing: -0.025em;
      background: linear-gradient(110deg, #3b82f6 0%, #8b5cf6 25%, #fff 50%, #8b5cf6 75%, #06b6d4 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: prism-refract 4s linear infinite;
    }
    @keyframes prism-refract { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
      font-style: italic;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(to right, #2563eb, #4f46e5);
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
    }
    button:hover {
      background: linear-gradient(to right, #3b82f6, #6366f1);
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 40px rgba(37, 99, 235, 0.4);
    }
    button:active {
      transform: translateY(0) scale(0.98);
    }
    #status {
      font-size: 10px;
      font-weight: 900;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      height: 16px;
      font-style: italic;
    }
    .footer {
      font-size: 8px;
      font-weight: 900;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white;"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .52 8.105H19a2 2 0 0 0 .1-3.998 4 4 0 0 0-1.517-7.767A3 3 0 1 0 12 5z"/></svg>
    </div>
    <div>
      <h1>Dassah's Prism</h1>
      <p>Reclaim your sovereignty.</p>
    </div>
    <div id="status">Neural Link: Ready</div>
    <button id="simplifyBtn">Refract Page</button>
    <div class="footer">DJ | Rooted in Christ</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
